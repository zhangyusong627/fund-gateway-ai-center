spring.application.name=fund-guardian
server.port=${SERVER_PORT:18082}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=fund-guardian-runtime
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=${GUARDIAN_METRIC_CONSUMER_AUTO_START:false}
guardian.metric-consumer.auto-start=${GUARDIAN_METRIC_CONSUMER_AUTO_START:false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fund_acceptance}
      POSTGRES_USER: fund_demo
      POSTGRES_PASSWORD: fund_demo_password
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_demo -d fund_integration"]
      interval: 5s
      timeout: 3s
      retries: 10
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - '19092:19092'
      - '19644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 12

  fund-integration:
    build:
      context: .
      dockerfile: Dockerfile.integration
    ports:
      - '18081:18081'
    depends_on:
      postgres:
        condition: service_healthy

  fund-guardian:
    build:
      context: .
      dockerfile: Dockerfile.guardian
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - '18082:18082'
    depends_on:
      redpanda:
        condition: service_healthy

  fund-console:
    build:
      context: .
      dockerfile: Dockerfile.console
    # 从仓库外的本机密钥文件注入，避免依赖启动 Compose 的 Shell 是否加载 ~/.zshrc。
    env_file:
      - ${HOME}/.config/fund-gateway-ai-center/deepseek.env
    environment:
      CONSOLE_ENVIRONMENT: ${CONSOLE_ENVIRONMENT:-acceptance}
      CONSOLE_JDBC_URL: jdbc:postgresql://postgres:5432/${CONSOLE_DB_NAME:-fund_acceptance}
      CONSOLE_JDBC_USER: fund_demo
      CONSOLE_JDBC_PASSWORD: fund_demo_password
      CONSOLE_PERSISTENCE_MODE: jdbc
      BGE_MODEL_PATH: /app/models/bge-small-zh-v1.5
      DOCUMENT_STORAGE_PATH: /app/runtime/documents
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - document-data:/app/runtime/documents
    ports:
      - '18080:18080'
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  redpanda-data:
  postgres-data:
  document-data:

spring.application.name=fund-console
server.port=${SERVER_PORT:18080}
console.environment=${CONSOLE_ENVIRONMENT:acceptance}
console.persistence.mode=${CONSOLE_PERSISTENCE_MODE:jdbc}
console.jdbc.url=${CONSOLE_JDBC_URL:jdbc:postgresql://localhost:55432/fund_acceptance}
console.jdbc.user=${CONSOLE_JDBC_USER:fund_demo}
console.jdbc.password=${CONSOLE_JDBC_PASSWORD:fund_demo_password}
console.embedding.model-path=${BGE_MODEL_PATH:models/bge-small-zh-v1.5}
console.document.storage-path=${DOCUMENT_STORAGE_PATH:runtime/documents}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
